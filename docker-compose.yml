services:
  db:
    image: postgres:17-alpine
    container_name: netforensicx-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netforensicx}
      POSTGRES_USER: ${POSTGRES_USER:-netforensicx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-development}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netforensicx} -d ${POSTGRES_DB:-netforensicx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: netforensicx-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-netforensicx}:${POSTGRES_PASSWORD:-change-me-in-development}@db:5432/${POSTGRES_DB:-netforensicx}
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./evidence:/evidence
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.db.init &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    container_name: netforensicx-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
